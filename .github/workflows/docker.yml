name: Publish Docker image

on:
  push:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build and publish ${{ matrix.publish_tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: ubuntu:latest
            tag: edge-dist
            publish_tag: edge
          - base: ubuntu:resolute
            tag: edge-dist
            publish_tag: edge-resolute
          - base: ubuntu:noble
            tag: edge-dist
            publish_tag: edge-noble
          - base: ubuntu:jammy
            tag: edge-dist
            publish_tag: edge-jammy
          - base: alpine:latest
            tag: edge-musl-dist
            publish_tag: edge-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            BASE=${{ matrix.base }}
            TAG=${{ matrix.tag }}
          push: true
          tags: minizinc/minizinc:${{ matrix.publish_tag }}
